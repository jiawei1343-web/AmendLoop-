<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" role="img" aria-labelledby="title desc"><title id="title">AmendLoop纠正导航图：从用户纠正到规则分流、检查与回流</title><desc id="desc">可视化机制流程图。用户纠正进入当前模型理解，根据持续范围分到任务、会话、项目或全局记忆，按任务场景与有效期过滤，草稿经语义自评后修改或交付，不确定则保留限制。用户再次纠正时回到入口。</desc><defs><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#203548" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E80" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#CF7438" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#377EB8" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8A69B2" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9BAAB1" stroke-width="2.7" stroke-linejoin="round"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E9EAE4" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="2000" height="1500" rx="0" fill="#FBFAF5" stroke="#FBFAF5" stroke-width="2"/><rect width="2000" height="1500" fill="url(#grid)"/><text x="76" y="78" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="46" font-weight="600" fill="#203548" text-anchor="start">AmendLoop / 一次纠正，怎样进入下一次回答？</text><text x="78" y="126" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#667887" text-anchor="start">沿轨道看一次要求的分流、筛选、检查与回流。</text><path d="M1700 1327H1930V183H225V250" fill="none" stroke="#8A69B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10" marker-end="url(#arrow-purple)"/><rect x="1150" y="154" width="550" height="48" rx="20" fill="#FBFAF5" stroke="#FBFAF5" stroke-width="2"/><text x="1425" y="187" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#8A69B2" text-anchor="middle">你再次纠正 → 回到入口，重新明确要求</text><path d="M100 255H420Q440 255 440 275V365Q440 385 420 385H185L155 409V385H120Q100 385 100 365Z" fill="#FFFFFF" stroke="#203548" stroke-width="3"/><text x="270" y="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">你提出纠正</text><text x="270" y="350" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" fill="#667887" text-anchor="middle">“这次，先给结论。”</text><path d="M440 325H528" fill="none" stroke="#203548" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="530" y="255" width="400" height="145" rx="27" fill="#E8F2EF" stroke="#087E80" stroke-width="2"/><text x="730" y="304" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">当前模型理解原意</text><text x="730" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="500" fill="#087E80" text-anchor="middle">目标 ＋ 拒绝项 ＋ 验收问题</text><text x="730" y="381" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="400" fill="#667887" text-anchor="middle">保留一小段来源原话</text><path d="M730 400V420H600V428" fill="none" stroke="#203548" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M600 430L710 540L600 650L490 540Z" fill="#F0F5ED" stroke="#087E80" stroke-width="3"/><text x="600" y="542" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">作用多久？</text><text x="600" y="571" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="400" fill="#667887" text-anchor="middle">按用户原话选择</text><path d="M490 540H250V1070" fill="none" stroke="#203548" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="651" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="start">① 先分范围，再保存</text><path d="M250 740H397" fill="none" stroke="#CF7438" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><circle cx="250" cy="740" r="6" fill="#CF7438"/><text x="309" y="725" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#CF7438" text-anchor="middle">这次</text><path d="M400 705V775A210.0 15 0 0 0 820 775V705" fill="#FBFAF5" stroke="#CF7438" stroke-width="3"/><ellipse cx="610.0" cy="705" rx="210.0" ry="15" fill="#FFFFFF" stroke="#CF7438" stroke-width="3"/><text x="610.0" y="744" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="600" fill="#CF7438" text-anchor="middle">本次任务</text><text x="610.0" y="775" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="400" fill="#667887" text-anchor="middle">仅绑定当前任务；结束后不再加载</text><path d="M820 740H998" fill="none" stroke="#CF7438" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><path d="M250 850H397" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="250" cy="850" r="6" fill="#087E80"/><text x="309" y="835" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#087E80" text-anchor="middle">接下来</text><path d="M400 815V885A210.0 15 0 0 0 820 885V815" fill="#FBFAF5" stroke="#087E80" stroke-width="3"/><ellipse cx="610.0" cy="815" rx="210.0" ry="15" fill="#FFFFFF" stroke="#087E80" stroke-width="3"/><text x="610.0" y="854" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="600" fill="#087E80" text-anchor="middle">当前会话</text><text x="610.0" y="885" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="400" fill="#667887" text-anchor="middle">留在当前聊天，不带去其他聊天</text><path d="M820 850H998" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M250 960H397" fill="none" stroke="#8A69B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><circle cx="250" cy="960" r="6" fill="#8A69B2"/><text x="309" y="945" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#8A69B2" text-anchor="middle">本项目</text><path d="M400 925V995A210.0 15 0 0 0 820 995V925" fill="#FBFAF5" stroke="#8A69B2" stroke-width="3"/><ellipse cx="610.0" cy="925" rx="210.0" ry="15" fill="#FFFFFF" stroke="#8A69B2" stroke-width="3"/><text x="610.0" y="964" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="600" fill="#8A69B2" text-anchor="middle">指定项目</text><text x="610.0" y="995" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="400" fill="#667887" text-anchor="middle">明确要求保存，并绑定项目根目录</text><path d="M820 960H998" fill="none" stroke="#8A69B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M250 1070H397" fill="none" stroke="#377EB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="250" cy="1070" r="6" fill="#377EB8"/><text x="309" y="1055" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#377EB8" text-anchor="middle">以后</text><path d="M400 1035V1105A210.0 15 0 0 0 820 1105V1035" fill="#FBFAF5" stroke="#377EB8" stroke-width="3"/><ellipse cx="610.0" cy="1035" rx="210.0" ry="15" fill="#FFFFFF" stroke="#377EB8" stroke-width="3"/><text x="610.0" y="1074" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="600" fill="#377EB8" text-anchor="middle">长期偏好</text><text x="610.0" y="1105" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="400" fill="#667887" text-anchor="middle">明确要求长期记住，才跨会话读取</text><path d="M820 1070H998" fill="none" stroke="#377EB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M1000 1070V325H1198" fill="none" stroke="#203548" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><text x="1024" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="start">同一偏好，</text><text x="1024" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="start">分领域选取</text><rect x="1200" y="255" width="560" height="145" rx="25" fill="#E8F2EF" stroke="#087E80" stroke-width="2"/><text x="1480" y="304" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">② 当前任务 × 场景 × 有效期</text><text x="1480" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="600" fill="#087E80" text-anchor="middle">只读取本次适用的规则</text><text x="1480" y="382" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="400" fill="#667887" text-anchor="middle">同一领域内：任务 → 会话 → 项目 → 全局</text><path d="M1760 325H1840V438" fill="none" stroke="#9BAAB1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10" marker-end="url(#arrow-gray)"/><rect x="1720" y="440" width="190" height="105" rx="20" fill="#F1F2F0" stroke="#DCE4E5" stroke-width="2"/><text x="1815" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="600" fill="#667887" text-anchor="middle">到期 / 不适用</text><text x="1815" y="516" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="middle">不进入草稿</text><path d="M1480 400V463" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="1260" y="465" width="440" height="105" rx="48" fill="#FFFFFF" stroke="#203548" stroke-width="2"/><text x="1480" y="508" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="600" fill="#203548" text-anchor="middle">当前模型形成草稿</text><text x="1480" y="545" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="middle">把要求用于这一次回答</text><path d="M1480 570V633" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="1480" y="615" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="middle">对照目标、拒绝项与验收问题</text><path d="M1480 635L1595 750L1480 865L1365 750Z" fill="#F0F5ED" stroke="#087E80" stroke-width="3"/><text x="1480" y="752" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">满足要求？</text><text x="1480" y="781" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="400" fill="#667887" text-anchor="middle">当前模型自评</text><path d="M1365 750H1150V515H1258" fill="none" stroke="#CF7438" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><rect x="1040" y="671" width="310" height="45" rx="18" fill="#FBFAF5" stroke="#FBFAF5" stroke-width="2"/><text x="1195" y="702" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#CF7438" text-anchor="middle">未满足 → 修改草稿</text><path d="M1595 750H1698" fill="none" stroke="#8A69B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><rect x="1700" y="700" width="210" height="109" rx="20" fill="#F0EBF5" stroke="#8A69B2" stroke-width="2"/><text x="1805" y="739" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="600" fill="#8A69B2" text-anchor="middle">不确定</text><text x="1805" y="777" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" fill="#667887" text-anchor="middle">说明限制 / 必要澄清</text><path d="M1805 809V950H1702" fill="none" stroke="#8A69B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M1480 865V898" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="1530" y="889" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#087E80" text-anchor="start">满足</text><rect x="1260" y="900" width="440" height="105" rx="24" fill="#FFFFFF" stroke="#087E80" stroke-width="2"/><text x="1480" y="944" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="600" fill="#203548" text-anchor="middle">③ 记录结果与依据</text><text x="1480" y="981" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="middle">保留“不确定”；不伪造通过</text><path d="M1480 1005V1088" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="1260" y="1090" width="440" height="95" rx="24" fill="#FFF0E5" stroke="#CF7438" stroke-width="2"/><text x="1480" y="1130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#203548" text-anchor="middle">④ 关闭本次任务</text><text x="1480" y="1167" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="500" fill="#CF7438" text-anchor="middle">本次例外到站即停；原偏好保留</text><path d="M1480 1185V1273" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="1260" y="1275" width="440" height="105" rx="48" fill="#0D7175" stroke="#0D7175" stroke-width="2"/><text x="1480" y="1320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="middle">交付回答</text><text x="1480" y="1356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="400" fill="#D8EEEE" text-anchor="middle">你仍可查看、修改或撤销规则</text><text x="100" y="1205" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="600" fill="#203548" text-anchor="start">规则维护旁路</text><path d="M130 1260H960" fill="none" stroke="#9BAAB1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10" /><circle cx="160" cy="1260" r="11" fill="#FBFAF5" stroke="#9BAAB1" stroke-width="5"/><text x="160" y="1306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#9BAAB1" text-anchor="middle">查看</text><circle cx="350" cy="1260" r="11" fill="#FBFAF5" stroke="#9BAAB1" stroke-width="5"/><text x="350" y="1306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#9BAAB1" text-anchor="middle">修改</text><circle cx="550" cy="1260" r="11" fill="#FBFAF5" stroke="#9BAAB1" stroke-width="5"/><text x="550" y="1306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#9BAAB1" text-anchor="middle">撤销 / 重做</text><circle cx="760" cy="1260" r="11" fill="#FBFAF5" stroke="#9BAAB1" stroke-width="5"/><text x="760" y="1306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#9BAAB1" text-anchor="middle">忘记</text><circle cx="950" cy="1260" r="11" fill="#FBFAF5" stroke="#9BAAB1" stroke-width="5"/><text x="950" y="1306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#9BAAB1" text-anchor="middle">备份</text><text x="100" y="1362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">相似规则先核对；已有规则不因一次例外被永久改写。</text><text x="100" y="1410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="start">实线：处理路径　　虚线：条件回流 / 旁路操作</text><text x="100" y="1462" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="400" fill="#667887" text-anchor="start">机制示意：需要宿主实际调用技能。记录是模型自评，不是独立验证，也不是模型训练。</text></svg>