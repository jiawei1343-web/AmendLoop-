<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">AmendLoop撤销与重做路线图：多步回退、重做和新分支</title><desc id="desc">第一部分展示C撤销到B再到A，以及反向重做。第二部分展示在B上改为D后，旧C重做分支不再可用，但审计记录仍保留。</desc><defs><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#203548" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E80" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#CF7438" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#377EB8" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8A69B2" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9BAAB1" stroke-width="2.7" stroke-linejoin="round"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E9EAE4" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1600" height="850" rx="0" fill="#FBFAF5" stroke="#FBFAF5" stroke-width="2"/><rect width="1600" height="850" fill="url(#grid)"/><text x="75" y="78" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="44" font-weight="600" fill="#203548" text-anchor="start">撤销是一条回得去的路，不是来回切换</text><text x="77" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="600" fill="#087E80" text-anchor="start">01 / 连续撤销与重做</text><circle cx="170" cy="275" r="48" fill="#FFFFFF" stroke="#087E80" stroke-width="4"/><text x="170" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="40" font-weight="600" fill="#203548" text-anchor="middle">A</text><circle cx="550" cy="275" r="48" fill="#FFFFFF" stroke="#087E80" stroke-width="4"/><text x="550" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="40" font-weight="600" fill="#203548" text-anchor="middle">B</text><circle cx="930" cy="275" r="48" fill="#FFFFFF" stroke="#087E80" stroke-width="4"/><text x="930" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="40" font-weight="600" fill="#203548" text-anchor="middle">C</text><path d="M883 238Q740 131 597 238" fill="none" stroke="#CF7438" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><text x="740" y="180" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="500" fill="#CF7438" text-anchor="middle">撤销：C → B</text><path d="M503 238Q360 131 217 238" fill="none" stroke="#CF7438" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><text x="360" y="180" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="500" fill="#CF7438" text-anchor="middle">再撤销：B → A</text><path d="M217 311Q360 416 503 311" fill="none" stroke="#087E80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="360" y="395" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="500" fill="#087E80" text-anchor="middle">重做：A → B</text><path d="M597 311Q740 416 883 311" fill="none" stroke="#087E80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="740" y="395" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="500" fill="#087E80" text-anchor="middle">再重做：B → C</text><text x="1125" y="255" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="600" fill="#203548" text-anchor="start">每次操作都检查版本。</text><text x="1125" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">规则变更留有历史，</text><text x="1125" y="343" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">不会悄悄覆盖别人的新修改。</text><path d="M75 455H1525" fill="none" stroke="#9BAAB1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="77" y="512" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="600" fill="#087E80" text-anchor="start">02 / 从 B 另改成 D，就走新的分支</text><circle cx="170" cy="630" r="43" fill="#FFFFFF" stroke="#087E80" stroke-width="4"/><text x="170" y="643" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="600" fill="#087E80" text-anchor="middle">A</text><circle cx="550" cy="630" r="43" fill="#FFFFFF" stroke="#087E80" stroke-width="4"/><text x="550" y="643" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="600" fill="#087E80" text-anchor="middle">B</text><circle cx="930" cy="630" r="43" fill="#FFFFFF" stroke="#9BAAB1" stroke-width="4"/><text x="930" y="643" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="600" fill="#9BAAB1" text-anchor="middle">C</text><path d="M215 630H505" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M595 630H883" fill="none" stroke="#9BAAB1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10" marker-end="url(#arrow-gray)"/><path d="M550 675V752H883" fill="none" stroke="#087E80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="930" cy="752" r="43" fill="#087E80"/><text x="930" y="766" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text><text x="1100" y="624" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="600" fill="#203548" text-anchor="start">旧的 C 分支不能再重做。</text><text x="1100" y="671" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">C 的审计记录仍然保留，</text><text x="1100" y="713" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">当前状态沿新的 B → D 前进。</text></svg>