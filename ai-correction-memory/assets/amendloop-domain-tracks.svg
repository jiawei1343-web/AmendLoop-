<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">AmendLoop场景轨道图：写作与编程偏好分别保存、分别读取</title><desc id="desc">回答详略根据当前任务分流。写作任务读取详细解释，编程任务读取简洁给代码。两个分支彼此保留。</desc><defs><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#203548" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E80" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#CF7438" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#377EB8" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8A69B2" stroke-width="2.7" stroke-linejoin="round"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9BAAB1" stroke-width="2.7" stroke-linejoin="round"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E9EAE4" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1600" height="840" rx="0" fill="#FBFAF5" stroke="#FBFAF5" stroke-width="2"/><rect width="1600" height="840" fill="url(#grid)"/><text x="75" y="78" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="44" font-weight="600" fill="#203548" text-anchor="start">同一偏好，可以走两条不同的轨道</text><text x="77" y="124" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" fill="#667887" text-anchor="start">写作需要详细说明，编程需要简洁实现；按当前任务选分支。</text><circle cx="190" cy="430" r="26" fill="#FBFAF5" stroke="#203548" stroke-width="5"/><text x="190" y="491" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#203548" text-anchor="middle">偏好：回答详略</text><path d="M216 430H390" fill="none" stroke="#203548" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M390 430V275H559" fill="none" stroke="#8A69B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M390 430V585H559" fill="none" stroke="#377EB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="390" cy="430" r="8" fill="#203548"/><text x="390" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="middle">识别当前场景</text><circle cx="590" cy="275" r="27" fill="#FBFAF5" stroke="#8A69B2" stroke-width="5"/><text x="590" y="337" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#8A69B2" text-anchor="middle">写作</text><path d="M618 275H798" fill="none" stroke="#8A69B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><rect x="800" y="225" width="300" height="100" rx="48" fill="#FFFFFF" stroke="#8A69B2" stroke-width="2"/><text x="950" y="285" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#8A69B2" text-anchor="middle">详细解释</text><path d="M1100 275H1298" fill="none" stroke="#8A69B2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><circle cx="1335" cy="275" r="36" fill="#8A69B2"/><path d="M1319 275L1330 286L1351 261" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1335" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="600" fill="#203548" text-anchor="middle">写作任务读取</text><circle cx="590" cy="585" r="27" fill="#FBFAF5" stroke="#377EB8" stroke-width="5"/><text x="590" y="647" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#377EB8" text-anchor="middle">编程</text><path d="M618 585H798" fill="none" stroke="#377EB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="800" y="535" width="300" height="100" rx="48" fill="#FFFFFF" stroke="#377EB8" stroke-width="2"/><text x="950" y="595" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#377EB8" text-anchor="middle">简洁给代码</text><path d="M1100 585H1298" fill="none" stroke="#377EB8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="1335" cy="585" r="36" fill="#377EB8"/><path d="M1319 585L1330 596L1351 571" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1335" y="668" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="600" fill="#203548" text-anchor="middle">编程任务读取</text><path d="M590 320V523" fill="none" stroke="#9BAAB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 10" /><text x="642" y="444" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#667887" text-anchor="start">保留两个分支；不把一条规则全局覆盖到另一条。</text><text x="75" y="775" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#667887" text-anchor="start">若当前场景不明确，返回分支信息，由当前模型结合任务判断；不默默丢掉规则。</text></svg>